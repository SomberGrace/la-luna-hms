<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>La Luna HMS · Interactive Prototype</title>
  <link rel="stylesheet" href="assets/css/prototype.css">
</head>
<body>
  <div class="ambient"><div class="grain"></div></div>

  <div class="stage">
    <header class="toolbar">
      <a class="tb-brand" href="index.html" aria-label="Back to prototype start">
        <span class="tb-logo"><i class="ph ph-moon" aria-hidden="true"></i></span>
        <span>
          <span class="tb-name">LA LUNA</span>
          <span class="tb-sub">HMS · Interactive prototype</span>
        </span>
      </a>
      <div class="tb-route"><i class="ph ph-map-pin" aria-hidden="true"></i><span id="route-label">/</span></div>
      <div class="tb-actions">
        <button type="button" class="tool-btn" id="btn-screens" title="Screen map (M)">
          <i class="ph ph-squares-four" aria-hidden="true"></i><span>Screens</span>
        </button>
        <button type="button" class="tool-btn" id="btn-hotspots" title="Reveal hotspots (H)">
          <i class="ph ph-selection-plus" aria-hidden="true"></i><span>Hotspots</span>
        </button>
        <button type="button" class="tool-btn" id="btn-focus" title="Focus mode">
          <i class="ph ph-arrows-out" aria-hidden="true"></i><span>Focus</span>
        </button>
        <button type="button" class="tool-btn" id="btn-reset" title="Reset prototype">
          <i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i><span>Reset</span>
        </button>
      </div>
      <div class="tb-hint"><kbd>M</kbd> map <kbd>H</kbd> hotspots <kbd>Esc</kbd> close</div>
    </header>

    <div class="device">
      <div class="app" id="app" data-dept="portal">
        <div class="statusbar">
          <span class="sb-time">9:41</span>
          <span class="sb-right">
            <span class="sb-bars"><i></i><i></i><i></i><i></i></span>
            <i class="ph ph-wifi-high" aria-hidden="true"></i>
            <span class="sb-batt"></span>
          </span>
        </div>
        <header class="appbar" id="appbar"></header>
        <main class="viewport" id="viewport"></main>
        <nav class="tabbar" id="tabbar"></nav>
        <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
        <div class="modal-layer" id="modal-layer" hidden></div>
      </div>
    </div>
  </div>

  <div class="drawer-scrim" id="drawer-scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Screen map"></aside>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/data-screens-guest.js"></script>
  <script src="assets/js/data-screens-frontdesk.js"></script>
  <script src="assets/js/data-screens-ops.js"></script>
  <script src="assets/js/data-modals.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
